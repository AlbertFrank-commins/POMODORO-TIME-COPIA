<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador Pomodoro</title>
  <!-- Fuentes de la clase (Space Grotesk, Inter, JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Botón de Modo Claro / Oscuro en la esquina superior -->
  <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema">🌙</button>

  <main class="pomodoro-container">
    <header class="pomodoro-header">
      <h1>Focus</h1>
    </header>

    <!-- Selector de Modos -->
    <nav class="modes">
      <button class="btn mode-btn active" data-time="1500">Pomodoro (25m)</button>
      <button class="btn mode-btn" data-time="300">Descanso Corto (5m)</button>
      <button class="btn mode-btn" data-time="900">Descanso Largo (15m)</button>
    </nav>

    <!-- Pantalla del Reloj -->
    <section class="timer-display" aria-live="polite">
      <span id="time">25:00</span>
    </section>

    <!-- Controles de Acción -->
    <footer class="controls">
      <button id="start-pause-btn" class="btn primary-btn">Iniciar</button>
      <button id="reset-btn" class="btn secondary-btn">Reiniciar</button>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
